<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Books</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li {
      border-bottom: 1px solid #eee;
      padding: 0.75rem 0;
    }
    a {
      color: #0b5fff;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .empty { color: #666; }
  </style>
</head>
<body>
  <h1>Books</h1>
  {% if books %}
    <ul>
      {% for book in books %}
        <li><a href="{{ url_for('download_pdf', filename=book) }}">{{ book }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No PDFs found. Add files to the <code>books/</code> folder.</p>
  {% endif %}
</body>
</html>
